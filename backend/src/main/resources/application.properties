# =========================================
# Active Profile
# Set to "dev" to run instantly with an in-memory H2 database (no setup needed)
# Set to "prod" (or leave blank + edit values below) to use MySQL
# =========================================
spring.profiles.active=dev

# =========================================
# MySQL Configuration (used when profile = prod)
# =========================================
spring.datasource.url=jdbc:mysql://localhost:3306/blogdb?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true

# =========================================
# Server
# =========================================
server.port=8080

# =========================================
# JWT Configuration
# secret must be Base64-safe and at least 256 bits for HS256
# =========================================
app.jwt.secret=YmxvZ2FwcC1zdXBlci1zZWNyZXQtandULXNpZ25pbmcta2V5LWNoYW5nZS1pbi1wcm9kdWN0aW9uLTEyMzQ1Ng==
app.jwt.expiration-ms=86400000

# =========================================
# File Upload (post cover images, base64 or multipart)
# =========================================
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB
