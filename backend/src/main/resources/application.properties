# =========================================
# Active Profile
# Set to "dev"  → H2 in-memory DB (zero setup, auto-seeds demo data)
# Set to "prod" → MySQL (see application-prod.properties)
# =========================================
spring.profiles.active=dev

# =========================================
# Server
# =========================================
server.port=8080

# =========================================
# JWT Configuration
# secret must be Base64-encoded and at least 256 bits for HS256
# Override in production with JWT_SECRET env var (prod profile)
# =========================================
app.jwt.secret=YmxvZ2FwcC1zdXBlci1zZWNyZXQtandULXNpZ25pbmcta2V5LWNoYW5nZS1pbi1wcm9kdWN0aW9uLTEyMzQ1Ng==
app.jwt.expiration-ms=86400000

# =========================================
# File Upload limits (cover image URLs are preferred; multipart ready for future)
# =========================================
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB
