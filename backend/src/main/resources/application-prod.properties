# =========================================
# Production profile — MySQL
# Activate with: spring.profiles.active=prod
# Or: mvn spring-boot:run -Dspring-boot.run.profiles=prod
# =========================================

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/blogdb?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=false

# Override JWT secret in production via environment variable
app.jwt.secret=${JWT_SECRET:YmxvZ2FwcC1zdXBlci1zZWNyZXQtandULXNpZ25pbmcta2V5LWNoYW5nZS1pbi1wcm9kdWN0aW9uLTEyMzQ1Ng==}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}
